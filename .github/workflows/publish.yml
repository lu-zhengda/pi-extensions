name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Publish pi-ext-clear
        working-directory: clear
        run: npm publish --provenance --access public
      - name: Publish pi-ext-exit
        working-directory: exit
        run: npm publish --provenance --access public